name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lifepage_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d lifepage_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lifepage_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lifepage_test
      AUTH_SECRET: ci-auth-secret
      NEXTAUTH_SECRET: ci-nextauth-secret
      AUTH_URL: http://127.0.0.1:3001
      NEXTAUTH_URL: http://127.0.0.1:3001
      OPENAI_API_KEY: ci-openai-key
      CRON_SECRET: ci-cron-secret
      STRIPE_WEBHOOK_SECRET: whsec_ci_secret
      STRIPE_PLUS_MONTHLY_PRICE_ID: price_ci_plus_monthly
      STRIPE_PLUS_YEARLY_PRICE_ID: price_ci_plus_yearly
      STRIPE_PRO_MONTHLY_PRICE_ID: price_ci_pro_monthly
      STRIPE_PRO_YEARLY_PRICE_ID: price_ci_pro_yearly
      CLOUDFLARE_SAAS_CNAME_TARGET: customers.e2e.lifepage.test
      CLOUDFLARE_SAAS_FALLBACK_ORIGIN: origin.e2e.lifepage.test
      E2E_BASE_URL: http://127.0.0.1:3001
      E2E_TEST_MODE: "1"
      E2E_FAKE_STRIPE: "1"
      E2E_FAKE_CLOUDFLARE: "1"
      E2E_FAKE_DNS: "1"
      E2E_FAKE_CRAWL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Sync disposable test schema
        run: npx prisma db push --force-reset

      - name: Lint
        run: npm run lint

      - name: Next build
        run: npm run build

      - name: Cloudflare build
        run: npm run cf:build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
