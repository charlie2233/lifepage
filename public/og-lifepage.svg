      <feGaussianBlur stdDeviation="55" result="effect1_foregroundBlur_1_2"/>
    </filter>
    <filter id="blurB" x="781" y="277" width="440" height="440" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
