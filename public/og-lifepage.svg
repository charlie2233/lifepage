      <stop offset="0.55" stop-color="#0C1820"/>
      <stop offset="1" stop-color="#142531"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="92" y2="92" gradientUnits="userSpaceOnUse">
